# ---------------------------------------------------------
# vChat - Configuración Principal
# ---------------------------------------------------------

# Logging (Registro de Violaciones)
logging:
  enabled: true
  file: "violations.log"
  # Variables: %date%, %player%, %reason%, %message%
  format: "[%date%] Player: %player% | Reason: %reason% | Original: %message%"

# Sonidos Generales
sounds:
  reload: "ENTITY_PLAYER_LEVELUP"
  blocked: "BLOCK_NOTE_BLOCK_BASS"
  toggle-on: "BLOCK_NOTE_BLOCK_PLING"
  toggle-off: "BLOCK_NOTE_BLOCK_BASS"

# Cooldown global entre comandos de jugadores
command-cooldown:
  enabled: true
  seconds: 3
  # Comandos exentos (sin /)
  exempt-commands: []

# ---------------------------------------------------------
# Redis (multiserver) — solo soportado en Paper.
# Transporta chat global, /msg, /reply, SocialSpy, presencia e invalidaciones.
# Las preferencias e ignores durables permanecen en MySQL.
# ---------------------------------------------------------
storage:
  type: sqlite
  sqlite-file: "vchat.db"
  mysql:
    host: localhost
    port: 3306
    database: valerin
    user: root
    password: ""
    use-ssl: false

redis:
  enabled: false
  host: localhost
  port: 6379
  user: ""
  password: ""
  database: 0
  use-ssl: false
  # ID único de ESTE server dentro del network (debe coincidir con el nombre en el proxy).
  server-id: "server1"
  # Agrupa servers que comparten el mismo Redis pero deben tratarse como red aparte.
  network-id: "valerin"
  presence-ttl-seconds: 30
  heartbeat-seconds: 10
  # Tiempo para distinguir un cambio de backend de una desconexión real.
  transfer-grace-seconds: 20
  ack-timeout-millis: 3000
