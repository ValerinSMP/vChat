# ---------------------------------------------------------
# vChat - Mensajes del Sistema
# ---------------------------------------------------------
prefix: "&8[&bvChat&8] "
# Si es false, los mensajes de actionbar se envían como mensaje de chat normal
use-actionbar: true
messages:
  reload: "&aConfiguración recargada correctamente."
  no-permission: "&cNo tienes permiso para esto."
  notify-enabled: "&aNotificaciones de admin activadas."
  notify-disabled: "&cNotificaciones de admin desactivadas."
  mentions-enabled: "&aHas activado las menciones."
  mentions-disabled: "&cHas desactivado las menciones."

# Formato de notificación admin
admin-notify:
  - ""
  - "&#FF6961%player% fue marcado por: %reason%."
  - "&cMensaje: &r%message%"
  - ""

count-message: "&e%player% tiene %count% violaciones en esta sesión."

placeholders:
  enabled: "true"
  disabled: "false"

private:
  disabled-target: "&c%player% no está aceptando mensajes privados."
  disabled-self: "&cHas desactivado tus mensajes privados."
  toggled-on: "&aMensajes privados activados."
  toggled-off: "&cMensajes privados desactivados."
  no-reply: "&cNo tienes a nadie a quien responder."
  no-self: "&cNo puedes enviarte mensajes a ti mismo."

death:
  enabled: true
  # Mundos donde NO se muestran mensajes de muerte (nombre exacto del mundo)
  disabled-worlds: []
  pvp-format: "<color:#FF6961>☠ <lp_victim> <gray>fue asesinado por <color:#FF6961>🗡 <lp_killer>"
  pve-format: "<color:#FF6961>☠ <lp_victim> <gray>ha muerto"

join:
  format: "<gold>🌊 <lp_prefix><player_name></gold> <yellow>sᴇ ʜᴀ ᴜɴɪᴅᴏ <gold>🌊 <dark_gray>(<online>)"
  first-join: "<yellow>⭐ <gold><lp_prefix><player_name></gold> <yellow>sᴇ ᴜɴᴇ ᴘᴏʀ ᴘʀɪᴍᴇʀᴀ ᴠᴇᴢ ⭐ <gold>(#<player_number>)</gold>"
  # Sonido global de entrada (vacío = ninguno)
  sound: ""  # formato: "NOMBRE_SONIDO [volumen] [pitch]"  ej: "ENTITY_PLAYER_LEVELUP 1.0 1.2"
  # Sonido por grupo — formato: "NOMBRE_SONIDO [volumen] [pitch]"
  # Ejemplo:
  # vip: "ENTITY_PLAYER_LEVELUP"
  # owner: "UI_TOAST_CHALLENGE_COMPLETE 2.0 1.5"
  group-sounds: {}
  # Formato por grupo — si está definido reemplaza 'format' para ese rango
  # Ejemplo:
  # owner: "<red>[OWNER] <lp_prefix><player_name></red> <gray>ha entrado al servidor."
  # admin: "<dark_red>[ADMIN] <lp_prefix><player_name></dark_red> <gray>se ha unido."
  group-formats: {}

moderation:
  chat-muted: "&cEl chat ha sido desactivado por un administrador."
  chat-unmuted: "&aEl chat ha sido activado por un administrador."
  chat-is-muted: "&cEl chat está desactivado."
  personal-chat-enabled: "&aHas activado el chat global."
  personal-chat-disabled: "&cHas ocultado el chat global."
  announcements-enabled: "&aAnuncios activados."
  announcements-disabled: "&cAnuncios desactivados."
  death-enabled: "&aMensajes de muerte activados."
  death-disabled: "&cMensajes de muerte desactivados."
  command-cooldown: "&cEspera &e%time%s &cantes de usar otro comando."
